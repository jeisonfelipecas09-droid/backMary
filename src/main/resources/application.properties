spring.application.name=BackJava
server.port=8080

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:oracle}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

jwt.secret=${JWT_SECRET:MiClaveSecretaParaJWTDeCorrespondencia123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.main.banner-mode=off
